<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Build and install CleanYourTV on a GLAZE TV</title>
  <desc id="desc">Three steps: build the APK with GitHub Actions, copy it to a USB flash drive, and install it on a GLAZE TV.</desc>
  <rect width="1200" height="620" rx="24" fill="#17231e"/>
  <path d="M0 480c170-95 285 28 444-19 177-53 296-147 445-84 124 52 194 19 311-34v277H0Z" fill="#20352c"/>
  <text x="66" y="82" fill="#eff3e8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2">GLAZE TV  /  CLEAN YOUR TV</text>
  <text x="66" y="137" fill="#eff3e8" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Build it. Carry it. Install it.</text>
  <text x="67" y="171" fill="#b5c8bb" font-family="Arial, Helvetica, sans-serif" font-size="17">A simple APK transfer using a USB flash drive</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="115" cy="231" r="18" fill="#d7f36b"/>
    <text x="115" y="237" text-anchor="middle" fill="#17231e" font-size="16" font-weight="700">1</text>
    <text x="147" y="237" fill="#eff3e8" font-size="18" font-weight="700">BUILD APK</text>
    <circle cx="499" cy="231" r="18" fill="#ff9878"/>
    <text x="499" y="237" text-anchor="middle" fill="#17231e" font-size="16" font-weight="700">2</text>
    <text x="531" y="237" fill="#eff3e8" font-size="18" font-weight="700">COPY TO USB</text>
    <circle cx="882" cy="231" r="18" fill="#9ad8d0"/>
    <text x="882" y="237" text-anchor="middle" fill="#17231e" font-size="16" font-weight="700">3</text>
    <text x="914" y="237" fill="#eff3e8" font-size="18" font-weight="700">INSTALL ON TV</text>
  </g>

  <path d="M343 359h92m-15-13 15 13-15 13M727 359h92m-15-13 15 13-15 13" fill="none" stroke="#d7f36b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle r="7" fill="#ff9878">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M344 359H430"/>
  </circle>
  <circle r="7" fill="#9ad8d0">
    <animateMotion begin="1.2s" dur="2.4s" repeatCount="indefinite" path="M728 359H814"/>
  </circle>

  <g transform="translate(89 270)">
    <rect x="0" y="13" width="245" height="164" rx="12" fill="#f0f1e6"/>
    <rect x="13" y="26" width="219" height="134" rx="5" fill="#263b32"/>
    <path d="M90 177h65l13 17H77Z" fill="#b5c8bb"/>
    <path d="M108 68h24v24h-24zM138 68h24v24h-24zM108 98h24v24h-24zM138 98h24v24h-24z" fill="#d7f36b"/>
    <text x="61" y="51" fill="#b5c8bb" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">GITHUB ACTIONS</text>
    <text x="109" y="145" fill="#eff3e8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">APK READY</text>
  </g>

  <g transform="translate(474 306)">
    <path d="M0 27h64v82a17 17 0 0 1-17 17H17A17 17 0 0 1 0 109Z" fill="#ff9878"/>
    <path d="M17 27V7h12v20m18 0V7h12v20" fill="none" stroke="#ff9878" stroke-width="8" stroke-linecap="round"/>
    <path d="M20 47h24v14H20z" fill="#17231e"/>
    <circle cx="32" cy="90" r="6" fill="#17231e"/>
    <text x="-28" y="169" fill="#b5c8bb" font-family="Arial, Helvetica, sans-serif" font-size="14">cleanyourtv-launcher.apk</text>
  </g>

  <g transform="translate(862 283)">
    <rect x="0" y="0" width="252" height="144" rx="13" fill="#eff3e8"/>
    <rect x="12" y="12" width="228" height="116" rx="5" fill="#31594b"/>
    <path d="M102 144v17h48v-17m-66 18h84" fill="none" stroke="#c1d1c5" stroke-width="8" stroke-linecap="round"/>
    <text x="126" y="42" text-anchor="middle" fill="#d7f36b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1">GLAZE TV</text>
    <rect x="72" y="56" width="108" height="48" rx="6" fill="#20352c"/>
    <path d="m117 67 20 13-20 13z" fill="#ff9878">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="66" y="556" fill="#b5c8bb" font-family="Arial, Helvetica, sans-serif" font-size="15">USB sideloading depends on your TV's firmware and install-permission settings.</text>
  <rect x="1006" y="526" width="130" height="38" rx="19" fill="#d7f36b"/>
  <text x="1071" y="550" text-anchor="middle" fill="#17231e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">APK TRANSFER</text>
</svg>