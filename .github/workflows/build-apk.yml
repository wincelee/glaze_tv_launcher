name: Build CleanYourTV launcher APK

# Put this file in your fork at: .github/workflows/build-apk.yml
# Then: Actions tab -> "Build CleanYourTV launcher APK" -> Run workflow.
# The APK appears under the run's Artifacts and on the repo's Releases page.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pull the launcher source from the original project, so this works from any repo (even an empty one).
      - uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: main
          path: src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Build release APK
        working-directory: src/launcher
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain

      - name: Rename APK
        run: cp src/launcher/app/build/outputs/apk/release/app-release.apk cleanyourtv-launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-launcher
          path: cleanyourtv-launcher.apk

      - name: Publish to a release (easy to download on the TV)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Launcher APK build ${{ github.run_number }}
          files: cleanyourtv-launcher.apk